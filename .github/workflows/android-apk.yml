name: Build Crumb APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CRUMB_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/crumb-release.jks
          chmod 600 android/crumb-release.jks

      - name: Build signed release APK
        env:
          CRUMB_KEYSTORE_PATH: ${{ github.workspace }}/android/crumb-release.jks
          CRUMB_KEYSTORE_PASSWORD: ${{ secrets.CRUMB_KEYSTORE_PASSWORD }}
          CRUMB_KEY_ALIAS: ${{ secrets.CRUMB_KEY_ALIAS }}
          CRUMB_KEY_PASSWORD: ${{ secrets.CRUMB_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crumb-15.1.1-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
