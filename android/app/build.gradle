plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.crumb'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.crumb'
        minSdk 23
        targetSdk 35
        versionCode 28
        versionName '15.2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('CRUMB_KEYSTORE_PATH') ?: 'crumb-release.jks')
            storePassword System.getenv('CRUMB_KEYSTORE_PASSWORD')
            keyAlias System.getenv('CRUMB_KEY_ALIAS')
            keyPassword System.getenv('CRUMB_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "Crumb-${variant.versionName}.apk"
    }
}
